name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_llm_evals:
        description: "Run LLM evaluation suite (consumes Gemini/Groq API quota)"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Fast Offline Checks and Tests (0 API tokens consumed)
  offline-tests:
    name: Build & Offline Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reprocheck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reprocheck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies & Build SPA
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          uv sync

      - name: Run Unit Tests
        working-directory: backend
        env:
          APP_ENV: testing
          LITELLM_LOCAL_MODEL_COST_MAP: "True"
          LANGFUSE_PUBLIC_KEY: ""
          LANGFUSE_SECRET_KEY: ""
        run: |
          uv run pytest tests/unit/ -v

      - name: Apply Database Migrations
        working-directory: backend
        env:
          APP_ENV: testing
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/reprocheck
          DATABASE_URL_SYNC: postgresql://postgres:postgres@127.0.0.1:5432/reprocheck
        run: |
          uv run alembic upgrade head

      - name: Run Integration Tests
        working-directory: backend
        env:
          APP_ENV: testing
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/reprocheck
          DATABASE_URL_SYNC: postgresql://postgres:postgres@127.0.0.1:5432/reprocheck
          REDIS_URL: redis://127.0.0.1:6379/0
          LITELLM_LOCAL_MODEL_COST_MAP: "True"
          LANGFUSE_PUBLIC_KEY: ""
          LANGFUSE_SECRET_KEY: ""
        run: |
          uv run pytest tests/integration/ -v

  # Job 2: Optional LLM & DeepEval Evaluation Suite (Runs only on demand or [run-evals] commit)
  llm-evaluations:
    name: Optional LLM Evaluations
    needs: [offline-tests]
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_llm_evals == true) || contains(github.event.head_commit.message, '[run-evals]') }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reprocheck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d reprocheck"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          uv sync

      - name: Apply Database Migrations
        working-directory: backend
        env:
          APP_ENV: testing
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/reprocheck
          DATABASE_URL_SYNC: postgresql://postgres:postgres@127.0.0.1:5432/reprocheck
        run: |
          uv run alembic upgrade head

      - name: Run DeepEval LLM Evaluations
        working-directory: backend
        env:
          APP_ENV: testing
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/reprocheck
          DATABASE_URL_SYNC: postgresql://postgres:postgres@127.0.0.1:5432/reprocheck
          REDIS_URL: redis://127.0.0.1:6379/0
          PRIMARY_MODEL: gemini/gemini-3.1-flash-lite
          FALLBACK_MODEL: groq/openai/gpt-oss-120b
          FAST_CHEAP_MODEL: groq/openai/gpt-oss-20b
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
          LITELLM_LOCAL_MODEL_COST_MAP: "True"
        run: |
          uv run pytest tests/evaluation/ -v

  # Job 3: Automated Continuous Deployment (Triggered on push to main after tests pass)
  deploy:
    name: Deploy to Production
    needs: [offline-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Cloud Webhook Deployment
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL || secrets.KOYEB_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK_URL" ]; then
            echo "Triggering cloud deploy hook..."
            curl -f -X POST "$DEPLOY_HOOK_URL"
            echo "Deploy hook successfully triggered."
          else
            echo "No DEPLOY_HOOK_URL secret configured. Cloud provider native git integration will handle auto-deploy if enabled."
          fi
